<!doctype html><html><head><meta charset="utf-8"><title>TIBIALY</title>
<style>
body{margin:0;height:100vh;display:grid;place-items:center;background:#0f0e0d;color:#ede9e3;font:16px system-ui,sans-serif}
.box{text-align:center;max-width:420px;border:1px solid #2a2826;border-radius:16px;padding:40px}
h1{font:500 28px Georgia,serif;margin:0 0 10px}p{color:#8c877f;line-height:1.5}
button{margin-top:18px;background:#e3b04a;color:#0f0e0d;border:0;border-radius:10px;padding:11px 22px;font-weight:600;cursor:pointer}
</style></head><body><div class="box">
<h1>Can't reach TIBIALY</h1>
<p>Check your internet connection. If you are online, the server may be waking up: it takes about half a minute.</p>
<button id="retry">Try again</button>
<p id="auto" style="font-size:13px"></p>
</div><script>
const url = new URLSearchParams(location.search).get('url');
const go = () => { location.href = url; };
document.getElementById('retry').onclick = go;
let n = 20; const t = setInterval(() => { document.getElementById('auto').textContent = 'Trying again in ' + n + ' s'; if (--n < 0) { clearInterval(t); go(); } }, 1000);
</script></body></html>
