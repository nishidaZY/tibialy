# Render Blueprint — free web service. Render → New → Blueprint → pick this repository.
services:
  - type: web
    name: tibialy
    runtime: ruby
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: DOWNLOADS_URL
        value: https://github.com/nishidaZY/tibialy/releases/latest/download
      - key: WEB_CONCURRENCY
        value: "0"
